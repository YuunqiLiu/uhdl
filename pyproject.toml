[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uhdl"
dynamic = ["version"]
description = "Python hardware description library that generates Verilog"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Liuyunqi"}]
requires-python = ">=3.8"
# The core (writing designs, generate(), CDC check) needs only the standard library.
dependencies = []

[project.optional-dependencies]
# TemplateIP (ip_builder integration) now lives in the ip_builder repository.
demo = ["networkx", "matplotlib"]
test = ["pytest"]

[project.scripts]
uhdl = "uhdl.cli:main"

[tool.setuptools.dynamic]
version = {attr = "uhdl._version.__version__"}

[tool.setuptools.packages.find]
include = ["uhdl*"]

[tool.setuptools.package-data]
# SystemVerilog import: build with `python native/build.py` before building the wheel
uhdl = ["_native/libuhdl_slang.so"]

[tool.pytest.ini_options]
# skill/tests holds command-line test drivers for a built component, not pytest modules
testpaths = ["test"]
