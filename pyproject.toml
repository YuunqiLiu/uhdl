[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uhdl"
version = "0.9.0"
description = "Python hardware description library that generates Verilog"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Liuyunqi"}]
requires-python = ">=3.8"
# The core (writing designs, generate(), CDC check) needs only the standard library.
dependencies = []

[project.optional-dependencies]
# Reading SystemVerilog: VComponent, import_sv_package, slang lint.
# 8.1 is the last pyslang with Python 3.8 wheels. pyslang 12 is abi3 but depends on
# nanobind-backend, which has a wheel per Python version.
sv = [
    "pyslang==8.1.0 ; python_version < '3.11'",
    "pyslang>=12.1,<13 ; python_version >= '3.11'",
]
# TemplateIP (ip_builder integration) now lives in the ip_builder repository.
demo = ["networkx", "matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["uhdl*"]
